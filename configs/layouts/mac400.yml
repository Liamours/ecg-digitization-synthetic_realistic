name: mac400
mode: panel
panel_finding: configs/pages.yml
label_sets: [[I, II, III], [aVR, aVL, aVF], [V1, V2, V3], [V4, V5, V6]]
rows: 3
rows_mode: equal
tracking: baseline   # or overlap
cut_gap_px: 45
grid:
  kind: dot
  pitch_px_range: [9.0, 15.0]
  angle_range_deg: 6.0
  blackhat_kernel: 9
  blackhat_contrast: 28
  dot_area: [4, 45]
  dot_max_side: 9
zone:
  header_regex: 'MAC|1\.02|^GE'
  footer_regex: '^Man|25mm|mm/m|ADS|MDC|For|INNOQ'
  margin_px: 6
labels:
  label_regex: '^(I{1,3}|aV[RLFUlf]|a[UV][RLF]|[UV][1-6])$'
  fallback_columns: [255, 345]
pulses:
  gray_max: 130
  height_tolerance: [0.85, 1.15]
  width_mm: [4.0, 9.0]
  min_area: 80
  solid_fill_max: 0.5
mask:
  kind: threshold
  gray_max: 130
  min_component: 100
  label_max_area: 1500
  label_max_width: 70
  glyph_core: 2.5
  glyph_reach: 4
  contrast_min: 90   # gray levels darker than the local paper
  contrast_gray_max: 190
  bg_kernel_mm: 5.0   # wider than any trace stroke
  text_blob_max_mm: 6.0   # a printed character or word fragment is smaller than this in both directions
  text_box_pad_mm: 0.5
  solid_min_mm: 2.0   # thick filled blobs (header icon, stains) are not trace
  solid_fill: 0.6
