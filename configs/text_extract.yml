datasets: [mac400-phone_photo, mac400-scan, esta, legacy_2024]   # aliases from configs/paths.yml
suffixes: [".jpg", ".jpeg", ".png", ".pdf"]
rotation_runs:   # canonical digitize runs whose record.json gives each page's rotation to upright
  mac400-phone_photo: ['@inferences/canonical_mac400-phone_photo']
  mac400-scan: ['@inferences/canonical_mac400-scan']
  esta: ['@inferences/canonical_esta']
device: cuda
max_side: 3600   # px, long side of an image given to docling, as configs/digitize.yml work_side
seed: 42
log_dir: '@logs'
exclude:   # top-level folders of derived files inside a dataset, not sources
  legacy_2024: [dataset_overlay]   # docling boxes drawn on the PDF pages, 2026-09-25
