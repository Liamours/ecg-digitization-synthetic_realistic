ocr_threads: 4   # half the logical cores: a long CPU run coincided with a blue screen
device: cpu      # cpu, cuda, or auto (cuda when torch sees a GPU)
page_ocr_side: 2500
work_side: 3600   # px, long side a page is scaled down to once at load; 300 dpi letter scans are 3300
merge_page_text: true   # when the panel crop read no lead name, use the ones the page read found
overlay_max_side: 2200   # px, long side of the saved overlay jpgs
panel_margin_px: [90, 20]
sampling:
  bin_mm: 0.1
  min_bin_px: 1.2
  mm_per_s: 25.0
  baseline_window_bins: 120
record:   # the page's 12 leads on one time base (record.csv, record.json), see src/digitize/assemble.py
  fs: 500            # Hz, PTB-XL's native rate
  duration_s: 4.0    # a MAC 400 strip holds 3 to 4 s
  leads: [I, II, III, aVR, aVL, aVF, V1, V2, V3, V4, V5, V6]
  flat_p2p_mv: 0.05  # half a small box at 10 mm/mV: below this peak to peak the lead is a straight line (electrode off)
trim:   # a lead starting this far left of the others carries the calibration step; it is cut at where the others start
  early_start_mm: 2.0
  late_end_mm: 2.0   # likewise at the end: a lead running this far past the others loses the overrun
  margin_mm: 0.5
flags:
  coverage_min: 0.9
  p2p_max_mv: 6.0  # precordial leads reach 4 mV in this population; lead-off artifacts exceed it
checks:   # limits of src.digitize.checks; 0.8 is the 10th percentile of the Einthoven correlation on the ground-truth I, II, III signals of both synthetic sets (109 panels, median 0.99)
  pulse_tol_mv: 0.2
  einthoven_min_corr: 0.8
  max_lag_bins: 40
selftest:
  max_lag_bins: 40
gain:
  allowed: [5.0, 10.0]
  assumed: 10.0   # used when a panel prints no gain and the page read none: the clinical default
  tolerance: 0.2
trace_net:   # src.digitize.tracenet, trained by src.train_trace_net; used by layouts with mask kind trace_net
  weights: '@models/trace_net/20261003-1/best.pt'
  threshold: 0.5
unet:   # Open-ECG-Digitizer's pretrained trace network (code in third_party/open_ecg_digitizer, weights fetched by scripts/get_weights.sh)
  weights: '@models/open_ecg_digitizer-pretrained/unet_weights_07072025.pt'
  max_side: 3000
  threshold: 0.235
log_dir: '@logs'
